<svg xmlns="http://www.w3.org/2000/svg" width="480" height="478" viewBox="0 0 480 478" role="img" aria-labelledby="title desc">
<title id="title">Currently exploring</title>
<desc id="desc">AI-Assisted Engineering; Scalable Frontend Architecture; Distributed Systems Visualization; Modern UI Engineering; Real-time Observability; LLM Integrations &amp; Tooling.</desc>
<defs>
<radialGradient id="cyan-glow"><stop stop-color="#00e5ff" stop-opacity=".11"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
<radialGradient id="violet-glow"><stop stop-color="#8b5cf6" stop-opacity=".13"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<clipPath id="bounds"><rect x="1" y="1" width="478" height="476" rx="19"/></clipPath>
