<svg xmlns="http://www.w3.org/2000/svg" width="960" height="448" viewBox="0 0 960 448" role="img" aria-labelledby="title desc">
  <title id="title">Jowhar&#x27;s featured work</title>
  <desc id="desc">Yellow Self Storage, Insta Mess and MediHold: storage management, meal subscriptions and healthcare marketplace systems.</desc>
  <defs>
    <radialGradient id="cyanGlow"><stop stop-color="#00b8d4" stop-opacity=".23"/><stop offset="1" stop-color="#06060a" stop-opacity="0"/></radialGradient>
    <radialGradient id="violetGlow"><stop stop-color="#8b5cf6" stop-opacity=".24"/><stop offset="1" stop-color="#06060a" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge"><stop stop-color="#72e5d6"/><stop offset=".5" stop-color="#b9a0ff"/><stop offset="1" stop-color="#263244"/></linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="958" height="446" rx="18"/></clipPath>
  </defs>
  <style>
    .reveal { opacity: 1; }
    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: no-preference) {
      .reveal { animation: reveal .22s ease-out both; }
      .ambient { animation: drift 10s ease-in-out infinite alternate; }
      .ambient-alt { animation: drift 12s ease-in-out infinite alternate-reverse; }
      @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(15px, -10px); } }
    }
  </style>
  <rect x=".5" y=".5" width="959" height="447" rx="18" fill="#06060a" stroke="#202036"/>
  <g clip-path="url(#card)"><ellipse class="ambient" cx="120" cy="428" rx="300" ry="220" fill="url(#cyanGlow)"/><ellipse class="ambient-alt" cx="860" cy="60" rx="280" ry="200" fill="url(#violetGlow)"/><text x="480.0" y="44" fill="#8cb9c9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" text-anchor="middle" letter-spacing="5">FEATURED WORK</text><g class="reveal" style="animation-delay:0.12s"><rect x="32" y="82" width="896" height="104" rx="12" fill="#ffffff" fill-opacity=".025" stroke="#00e5ff" stroke-opacity=".16"/><circle cx="54" cy="110" r="4" fill="#00e5ff"/><text x="71" y="116" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600">Yellow Self Storage</text><text x="54" y="144" fill="#a3a7bd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" >Storage management, bookings, payments and analytics across admin, worker and mobile workflows.</text><text x="54" y="168" fill="#00e5ff" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" >Node.js · Express · MongoDB · Next.js · Redis</text></g><g class="reveal" style="animation-delay:0.27s"><rect x="32" y="198" width="896" height="104" rx="12" fill="#ffffff" fill-opacity=".025" stroke="#a88bfa" stroke-opacity=".16"/><circle cx="54" cy="226" r="4" fill="#a88bfa"/><text x="71" y="232" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600">Insta Mess</text><text x="54" y="260" fill="#a3a7bd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" >Meal subscriptions, supplier dashboards, food management and backend APIs.</text><text x="54" y="284" fill="#a88bfa" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" >Supplier workflows · Subscriptions · Backend APIs</text></g><g class="reveal" style="animation-delay:0.42s"><rect x="32" y="314" width="896" height="104" rx="12" fill="#ffffff" fill-opacity=".025" stroke="#e989b8" stroke-opacity=".16"/><circle cx="54" cy="342" r="4" fill="#e989b8"/><text x="71" y="348" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600">MediHold</text><text x="54" y="376" fill="#a3a7bd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" >Healthcare marketplace with prescription uploads, medicine ordering and admin workflows.</text><text x="54" y="400" fill="#e989b8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" >Healthcare workflows · Backend APIs · Dashboards</text></g></g>
</svg>
