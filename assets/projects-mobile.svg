<svg xmlns="http://www.w3.org/2000/svg" width="480" height="646" viewBox="0 0 480 646" role="img" aria-labelledby="title desc">
  <title id="title">Jowhar&#x27;s featured work</title>
  <desc id="desc">Yellow Self Storage, Insta Mess and MediHold: storage management, meal subscriptions and healthcare marketplace systems.</desc>
  <defs>
    <radialGradient id="cyanGlow"><stop stop-color="#00b8d4" stop-opacity=".23"/><stop offset="1" stop-color="#06060a" stop-opacity="0"/></radialGradient>
    <radialGradient id="violetGlow"><stop stop-color="#8b5cf6" stop-opacity=".24"/><stop offset="1" stop-color="#06060a" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge"><stop stop-color="#72e5d6"/><stop offset=".5" stop-color="#b9a0ff"/><stop offset="1" stop-color="#263244"/></linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="478" height="644" rx="18"/></clipPath>
  </defs>
  <style>
    .reveal { opacity: 1; }
    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: no-preference) {
      .reveal { animation: reveal .22s ease-out both; }
      .ambient { animation: drift 10s ease-in-out infinite alternate; }
      .ambient-alt { animation: drift 12s ease-in-out infinite alternate-reverse; }
      @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(15px, -10px); } }
    }
  </style>
  <rect x=".5" y=".5" width="479" height="645" rx="18" fill="#06060a" stroke="#202036"/>
  <g clip-path="url(#card)"><ellipse class="ambient" cx="120" cy="626" rx="300" ry="220" fill="url(#cyanGlow)"/><ellipse class="ambient-alt" cx="380" cy="60" rx="280" ry="200" fill="url(#violetGlow)"/><text x="240.0" y="44" fill="#8cb9c9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" text-anchor="middle" letter-spacing="5">FEATURED WORK</text><g class="reveal" style="animation-delay:0.12s"><rect x="24" y="78" width="432" height="174" rx="12" fill="#ffffff" fill-opacity=".025" stroke="#00e5ff" stroke-opacity=".16"/><circle cx="46" cy="106" r="4" fill="#00e5ff"/><text x="63" y="112" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600">Yellow Self Storage</text><text x="46" y="140" fill="#a3a7bd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" >Storage management, bookings, payments and</text><text x="46" y="163" fill="#a3a7bd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" >analytics across admin, worker and mobile</text><text x="46" y="186" fill="#a3a7bd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" >workflows.</text><text x="46" y="222" fill="#00e5ff" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" >Node.js · Express · MongoDB · Next.js ·</text><text x="46" y="241" fill="#00e5ff" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" >Redis</text></g><g class="reveal" style="animation-delay:0.27s"><rect x="24" y="264" width="432" height="174" rx="12" fill="#ffffff" fill-opacity=".025" stroke="#a88bfa" stroke-opacity=".16"/><circle cx="46" cy="292" r="4" fill="#a88bfa"/><text x="63" y="298" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600">Insta Mess</text><text x="46" y="326" fill="#a3a7bd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" >Meal subscriptions, supplier dashboards,</text><text x="46" y="349" fill="#a3a7bd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" >food management and backend APIs.</text><text x="46" y="408" fill="#a88bfa" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" >Supplier workflows · Subscriptions ·</text><text x="46" y="427" fill="#a88bfa" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" >Backend APIs</text></g><g class="reveal" style="animation-delay:0.42s"><rect x="24" y="450" width="432" height="174" rx="12" fill="#ffffff" fill-opacity=".025" stroke="#e989b8" stroke-opacity=".16"/><circle cx="46" cy="478" r="4" fill="#e989b8"/><text x="63" y="484" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600">MediHold</text><text x="46" y="512" fill="#a3a7bd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" >Healthcare marketplace with prescription</text><text x="46" y="535" fill="#a3a7bd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" >uploads, medicine ordering and admin</text><text x="46" y="558" fill="#a3a7bd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" >workflows.</text><text x="46" y="594" fill="#e989b8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" >Healthcare workflows · Backend APIs ·</text><text x="46" y="613" fill="#e989b8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" >Dashboards</text></g></g>
</svg>
