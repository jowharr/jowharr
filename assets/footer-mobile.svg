<svg xmlns="http://www.w3.org/2000/svg" width="480" height="100" viewBox="0 0 480 100" role="img" aria-labelledby="title desc">
  <title id="title">Built with curiosity</title>
  <desc id="desc">Jowhar — full stack engineer.</desc>
  <defs>
    <radialGradient id="cyanGlow"><stop stop-color="#00b8d4" stop-opacity=".23"/><stop offset="1" stop-color="#06060a" stop-opacity="0"/></radialGradient>
    <radialGradient id="violetGlow"><stop stop-color="#8b5cf6" stop-opacity=".24"/><stop offset="1" stop-color="#06060a" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge"><stop stop-color="#72e5d6"/><stop offset=".5" stop-color="#b9a0ff"/><stop offset="1" stop-color="#263244"/></linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="478" height="98" rx="18"/></clipPath>
  </defs>
  <style>
    .reveal { opacity: 1; }
    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: no-preference) {
      .reveal { animation: reveal .22s ease-out both; }
      .ambient { animation: drift 10s ease-in-out infinite alternate; }
      .ambient-alt { animation: drift 12s ease-in-out infinite alternate-reverse; }
      @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(15px, -10px); } }
    }
  </style>
  <rect x=".5" y=".5" width="479" height="99" rx="18" fill="#06060a" stroke="#202036"/>
  <g clip-path="url(#card)"><ellipse class="ambient" cx="240.0" cy="60" rx="340" ry="110" fill="url(#violetGlow)"/><circle cx="227.0" cy="33" r="2.5" fill="#00e5ff"/><circle cx="240.0" cy="33" r="2.5" fill="#8b5cf6"/><circle cx="253.0" cy="33" r="2.5" fill="#ec4899"/><text x="240.0" y="68" fill="#9197af" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" text-anchor="middle" letter-spacing="2">JOWHAR · BUILT WITH CURIOSITY</text></g>
</svg>
